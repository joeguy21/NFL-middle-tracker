name: Logic tests

on:
  push:
    branches:
      - feature/coordinated-game-plan
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated logic tests
        run: npm test
