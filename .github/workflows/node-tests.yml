name: Node tests

on:
  push:
    branches:
      - feature/coordinated-game-plan
  pull_request:
    branches:
      - main
      - feature/coordinated-game-plan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run test suite
        run: npm test
